<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="brand/favicon.png">
  <title>Brain O' Clock</title>
  <style>
    :root { --bg: #f7f6f2; --ink: #1c1b22; --muted: #5d5b68; --line: #e4e2da; --accent: #1f4fd1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0c10; --ink: #f1f0f5; --muted: #a9a7b6; --line: #2a2c36; --accent: #8ab4f8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { padding: 32px 20px; max-width: 460px; }
    h1 { font-size: 34px; line-height: 1.15; margin: 14px 0 4px; letter-spacing: -0.5px; }
    .tag { font-size: 12px; font-weight: 700; letter-spacing: 2.5px; color: var(--accent); }
    p { color: var(--muted); margin: 18px 0 26px; text-wrap: balance; }
    nav { border-top: 1px solid var(--line); padding-top: 18px; font-size: 15px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <img src="brand/mark.png" alt="" width="120" height="120">
  <h1>Brain O' Clock</h1>
  <div class="tag">THE QUIZ ALARM</div>
  <p>The alarm that only stops when you answer revision questions.</p>
  <nav><a href="terms.html">Terms and Conditions</a> &nbsp;·&nbsp; <a href="privacy.html">Privacy Policy</a></nav>
</main>
</body>
</html>
